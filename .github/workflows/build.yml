name: Build STL files

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Build all STL files
        run: |
          mkdir -p dist
          find src -type f -name '*.scad' | while read scad_file; do
            rel_path="${scad_file#src/}"
            stl_path="dist/${rel_path%.scad}.stl"
            mkdir -p "$(dirname "$stl_path")"
            echo "Building $stl_path"
            xvfb-run --auto-servernum openscad \
              -o "$stl_path" \
              --hardwarnings \
              "$scad_file"
          done
          echo "--- Built files ---"
          find dist -name "*.stl" -exec ls -lh {} \;

      - name: Render preview PNGs
        run: |
          find src -type f -name '*.scad' | while read scad_file; do
            png_path="${scad_file%.scad}.png"
            echo "Rendering $png_path"
            xvfb-run --auto-servernum openscad \
              --imgsize=1200,900 \
              --colorscheme=Tomorrow \
              -o "$png_path" \
              "$scad_file"
          done

      - name: Commit updated previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/**/*.png' || true
          if git diff --staged --quiet; then
            echo "No preview changes"
          else
            git commit -m "ci: update preview renders [skip ci]"
            git push
          fi

      - name: Upload STL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stl-files-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.stl
          generate_release_notes: true